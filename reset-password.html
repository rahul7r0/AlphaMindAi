<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - AlphaMind AI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="login-page">

<div class="login-box">

<h1>🤖 AlphaMind AI</h1>

<h2>Reset Password</h2>

<input type="password" id="newPassword" placeholder="New Password">

<input type="password" id="confirmPassword" placeholder="Confirm Password">

<button id="updatePasswordBtn">Update Password</button>

<p>
<a href="login.html">Back to Login</a>
</p>

</div>

</section>

<script type="module" src="firebase-auth.js"></script>

<script>
document
    .getElementById("updatePasswordBtn")
    .addEventListener("click", async () => {

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const email =
            localStorage.getItem("alphaMindResetEmail");

        if (!email) {
            alert("Reset email not found.");
            return;
        }

        if (newPassword.length < 6) {
            alert("Password must be at least 6 characters.");
            return;
        }

        if (newPassword !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }

        const button =
            document.getElementById("updatePasswordBtn");

        button.disabled = true;
        button.textContent = "Updating...";

        try {

            const response = await fetch(
                "http://localhost:3000/api/reset-password",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        newPassword: newPassword
                    })
                }
            );

            const data = await response.json();

            if (!data.success) {
                throw new Error(
                    data.message || "Password update failed"
                );
            }

            localStorage.removeItem(
                "alphaMindResetEmail"
            );

            alert("Password updated successfully! 🔐");

            window.location.href = "login.html";

        } catch (error) {

            console.error(
                "Reset Password Error:",
                error
            );

            alert(error.message);

            button.disabled = false;
            button.textContent = "Update Password";
        }

    });
</script>

</body>
</html>
